services:
  web:
    build: ./backend
    container_name: rabivault_web
    # See docker-compose.yml for why this is ASGI (uvicorn worker) rather
    # than plain WSGI gunicorn - Orthanc's Authorization plugin webhooks
    # need chunked request body support that WSGI doesn't have.
    command: >
      sh -c "python manage.py migrate &&
             python manage.py ensure_minio_bucket &&
             python manage.py collectstatic --noinput &&
             gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 3"
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      clamav:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: rabivault_worker
    command: celery -A config worker -l info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      clamav:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: rabivault_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - rabivault_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: rabivault_redis
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: rabivault_minio
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY}
    volumes:
      - rabivault_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc
    container_name: rabivault_minio_init
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${AWS_STORAGE_BUCKET_NAME} &&
      mc encrypt set sse-kms $${MINIO_KMS_SECRET_KEY%%:*} local/$${AWS_STORAGE_BUCKET_NAME} &&
      echo MinIO bucket ready and encrypted: $${AWS_STORAGE_BUCKET_NAME}
      "

  clamav:
    image: clamav/clamav:stable
    container_name: rabivault_clamav
    restart: unless-stopped

  backup:
    build: ./backup
    container_name: rabivault_backup
    volumes:
      - ./backups:/backups
    env_file:
      - .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sleep", "infinity"]
    restart: unless-stopped

  orthanc:
    image: orthancteam/orthanc
    container_name: rabivault_orthanc
    env_file:
      - .env
    environment:
      ORTHANC__NAME: "RabiVault Orthanc"
      # See docker-compose.yml for why core auth is off in favor of the
      # Authorization plugin - same tenant isolation, same webhooks, just
      # reached through Caddy (orthanc.<domain>) instead of a published port.
      ORTHANC__AUTHENTICATION_ENABLED: "false"
      AUTHORIZATION_PLUGIN_ENABLED: "true"
      ORTHANC__AUTHORIZATION__WEB_SERVICE_ROOT_URL: "http://web:8000/imaging/orthanc-auth/"
      ORTHANC__AUTHORIZATION__WEB_SERVICE_USERNAME: "${ORTHANC_WEBHOOK_USERNAME}"
      ORTHANC__AUTHORIZATION__WEB_SERVICE_PASSWORD: "${ORTHANC_WEBHOOK_PASSWORD}"
      ORTHANC__AUTHORIZATION__STANDARD_CONFIGURATIONS: '["orthanc-explorer-2"]'
      ORTHANC__AUTHORIZATION__CHECKED_LEVEL: "studies"
      ORTHANC__AUTHORIZATION__TOKEN_HTTP_HEADERS: '["token"]'
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__DICOM_SERVER_ENABLED: "true"
      ORTHANC__DICOM_AET: "${ORTHANC_AET}"
      ORTHANC__DICOM_PORT: "4242"
      ORTHANC__HTTP_PORT: "8042"
    volumes:
      - rabivault_orthanc_data:/var/lib/orthanc/db
    ports:
      # DICOM protocol only. Only expose this if an external PACS/modality
      # actually needs to send studies to this server; otherwise remove it.
      - "4242:4242"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: rabivault_caddy
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - orthanc
    restart: unless-stopped

volumes:
  rabivault_postgres_data:
  rabivault_minio_data:
  rabivault_orthanc_data:
  caddy_data:
  caddy_config:
